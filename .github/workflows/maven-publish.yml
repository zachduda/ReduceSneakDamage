name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        server-id: zachduda-maven-release # Value of the distributionManagement/repository/id field of the pom.xml
        server-username: MAVEN_DEPLOY_USERNAME
        server-password: MAVEN_DEPLOY_PASSWORD
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Publish to zachduda.com Maven repository
      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        MAVEN_DEPLOY_USERNAME: ${{ secrets.MAVEN_DEPLOY_USERNAME }}
        MAVEN_DEPLOY_PASSWORD: ${{ secrets.MAVEN_DEPLOY_PASSWORD }}
